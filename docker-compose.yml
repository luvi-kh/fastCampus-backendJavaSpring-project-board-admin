version: '2.4'

services:
  project-board-admin:
    image: mysql:latest
    container_name: project-board-admin
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_USER: "uno"
      MYSQL_PASSWORD: "uno"
      MYSQL_DATABASE: "admin"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - board-network

  app:
    image: eclipse-temurin:17-jdk-jammy
    container_name: project-board-admin-app
    ports:
      - "8081:8080"
    environment:
      LOCAL_DB_URL: "jdbc:mysql://project-board:3306/admin?allowPublicKeyRetrieval=true&useSSL=false"
      LOCAL_DB_USERNAME: "uno"
      LOCAL_DB_PASSWORD: "uno"
    depends_on:
      - project-board-admin
    volumes:
      - ./build/libs:/app
    working_dir: /app
    command: java -jar project-board-admin-0.0.1-SNAPSHOT.jar
    networks:
      - board-network

volumes:
  db_data:

networks:
  board-network:
    driver: bridge
